name: Cloud Build BrightIntosh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unlock App Store Purchase Restriction
        run: |
          sed -i '' 's/func isUnrestrictedUser(refresh: Bool = false) async throws -> Bool {/func isUnrestrictedUser(refresh: Bool = false) async throws -> Bool {\n        return true/' BrightIntosh/EntitlementHandler.swift

      - name: Strip Security Entitlements & App Groups
        run: |
          # Removes the strict entitlement requirements from the Xcode project file
          sed -i '' 's/CODE_SIGN_ENTITLEMENTS = [^;]*;/CODE_SIGN_ENTITLEMENTS = "";/g' BrightIntosh.xcodeproj/project.pbxproj

      - name: Compile Main App (Skipping Widget)
        run: |
          xcodebuild -project BrightIntosh.xcodeproj \
                     -target BrightIntosh \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     SYMROOT=$PWD/build \
                     OBJROOT=$PWD/build

      - name: Compress App Bundle
        run: |
          cd build/Release
          zip -r BrightIntosh.zip BrightIntosh.app

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: BrightIntosh-App
          path: build/Release/BrightIntosh.zip
