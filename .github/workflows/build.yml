name: Cloud Build BrightIntosh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unlock App Store Purchase Restriction
        run: |
          sed -i '' 's/func isUnrestrictedUser(refresh: Bool = false) async throws -> Bool {/func isUnrestrictedUser(refresh: Bool = false) async throws -> Bool {\n        return true/' BrightIntosh/EntitlementHandler.swift

      - name: Fix Repository Hack & Strip Signing 
        run: |
          # 1. Entirely delete signing lines so Xcode doesn't look for an empty filename
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' BrightIntosh.xcodeproj/project.pbxproj
          sed -i '' '/DEVELOPMENT_TEAM/d' BrightIntosh.xcodeproj/project.pbxproj
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' BrightIntosh.xcodeproj/project.pbxproj
          
          # 2. Revert the developer's fake macOS 26.2 hack back down to 15.0
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 26.2;/MACOSX_DEPLOYMENT_TARGET = 15.0;/g' BrightIntosh.xcodeproj/project.pbxproj

      - name: Delete Unsupported iOS-Only Widget Code
        run: |
          # Wipe the unsupported ControlWidget file blank
          echo "" > Widgets/BrightIntoshControlToggle.swift
          
          # Delete the line that tells the app to load the widget
          sed -i '' '/BrightIntoshControlToggle()/d' Widgets/WidgetsBundle.swift

      - name: Compile App with Ad-Hoc Signing
        run: |
          xcodebuild -project BrightIntosh.xcodeproj \
                     -scheme BrightIntosh \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=YES \
                     CODE_SIGNING_ALLOWED=YES \
                     SYMROOT=$PWD/build \
                     OBJROOT=$PWD/build

      - name: Compress App Bundle
        run: |
          cd build/Release
          zip -r BrightIntosh.zip BrightIntosh.app

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: BrightIntosh-App
          path: build/Release/BrightIntosh.zip
