name: Cloud Build BrightIntosh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unlock App Store Purchase Restriction
        run: |
          sed -i '' 's/func isUnrestrictedUser(refresh: Bool = false) async throws -> Bool {/func isUnrestrictedUser(refresh: Bool = false) async throws -> Bool {\n        return true/' BrightIntosh/EntitlementHandler.swift

      - name: Archive App (Bypasses Signing Errors)
        run: |
          xcodebuild -project BrightIntosh.xcodeproj \
                     -scheme BrightIntosh \
                     -configuration Release \
                     -archivePath $PWD/build/BrightIntosh.xcarchive \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Extract Completed App Bundle
        run: |
          mkdir -p dist
          cp -r build/BrightIntosh.xcarchive/Products/Applications/BrightIntosh.app dist/

      - name: Compress App Bundle
        run: |
          cd dist
          zip -r BrightIntosh.zip BrightIntosh.app

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: BrightIntosh-App
          path: dist/BrightIntosh.zip
