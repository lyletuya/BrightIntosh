name: Cloud Build BrightIntosh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unlock App Store Purchase Restriction
        run: |
          sed -i '' 's/func isUnrestrictedUser(refresh: Bool = false) async throws -> Bool {/func isUnrestrictedUser(refresh: Bool = false) async throws -> Bool {\n        return true/' BrightIntosh/EntitlementHandler.swift

      - name: Strip Signing Configurations from Project File
        run: |
          # Dynamically clear entitlements path, dev teams, and provisioning profiles inside the project configuration file
          sed -i '' 's/CODE_SIGN_ENTITLEMENTS = [^;]*;/CODE_SIGN_ENTITLEMENTS = "";/g' BrightIntosh.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' BrightIntosh.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' BrightIntosh.xcodeproj/project.pbxproj

      - name: Compile App with Ad-Hoc Signing
        run: |
          xcodebuild -project BrightIntosh.xcodeproj \
                     -scheme BrightIntosh \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=YES \
                     CODE_SIGNING_ALLOWED=YES \
                     SYMROOT=$PWD/build \
                     OBJROOT=$PWD/build

      - name: Compress App Bundle
        run: |
          cd build/Release
          zip -r BrightIntosh.zip BrightIntosh.app

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: BrightIntosh-App
          path: build/Release/BrightIntosh.zip
