name: Cloud Build BrightIntosh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile App (Ignore Xcode Signing Rules)
        run: |
          xcodebuild -project BrightIntosh.xcodeproj \
                     -scheme BrightIntosh \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     OBJROOT=$PWD/build \
                     SYMROOT=$PWD/build

      - name: Manually Force Local Ad-Hoc Signature
        run: |
          codesign --force --deep --sign - build/Release/BrightIntosh.app

      - name: Compress App Bundle
        run: |
          cd build/Release
          zip -r BrightIntosh.zip BrightIntosh.app

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: BrightIntosh-App
          path: build/Release/BrightIntosh.zip
